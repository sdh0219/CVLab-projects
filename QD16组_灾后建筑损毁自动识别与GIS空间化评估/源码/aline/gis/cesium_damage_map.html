<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>灾后建筑损毁分布图 (A 线 · Cesium · 高性能点渲染)</title>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>
  html,body,#cesiumContainer{width:100%;height:100%;margin:0;padding:0;overflow:hidden;font-family:"Microsoft YaHei",sans-serif;}
  #panel{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.72);color:#fff;padding:12px 14px;border-radius:8px;font-size:13px;line-height:1.85;z-index:999;max-width:280px;}
  #panel b{font-size:14px;}
  .sw{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:6px;vertical-align:middle;}
  select{width:100%;margin:6px 0;padding:4px;border-radius:4px;}
  #ctrl{margin-top:6px;}
  #ctrl button{background:#2a6;color:#fff;border:none;padding:4px 10px;border-radius:4px;cursor:pointer;margin-right:6px;}
  #ctrl button.off{background:#555;}
  #stat{margin-top:8px;font-size:12px;color:#ddd;}
  #sizeRow{margin-top:6px;font-size:12px;}
  #popup{position:absolute;background:rgba(0,0,0,.82);color:#fff;padding:8px 10px;border-radius:6px;font-size:12px;z-index:999;display:none;pointer-events:none;line-height:1.6;}
</style>
</head>
<body>
<div id="cesiumContainer"></div>
<div id="panel">
  <b>建筑损毁分布</b>
  <div style="font-size:12px;color:#9cf;margin-top:4px;">选择灾害事件：</div>
  <select id="disaster"></select>
  <div><span class="sw" style="background:#00b400"></span>完好</div>
  <div><span class="sw" style="background:#dcdc00"></span>轻微损毁</div>
  <div><span class="sw" style="background:#ff7800"></span>严重损毁</div>
  <div><span class="sw" style="background:#e60000"></span>完全损毁</div>
  <div><span class="sw" style="background:#808080"></span>未检出</div>
  <div id="ctrl">
    <button id="btnPred">按预测</button>
    <button id="btnTrue" class="off">按真值</button>
  </div>
  <div id="mode" style="font-size:12px;color:#9f9;">当前：模型预测</div>
  <div id="sizeRow">点大小 <input id="psize" type="range" min="3" max="14" value="7" style="vertical-align:middle"></div>
  <div id="stat"></div>
</div>
<div id="popup"></div>

<script>
const viewer = new Cesium.Viewer("cesiumContainer", {
  baseLayerPicker:false, geocoder:false, animation:false, timeline:false,
  navigationHelpButton:false, sceneModePicker:true, homeButton:true, infoBox:false, baseLayer:false
});
try {
  viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({
    url:"https://tile.openstreetmap.org/{z}/{x}/{y}.png", maximumLevel:19, credit:"© OpenStreetMap"}));
} catch(e){ console.warn(e); }
/* 国内若想用卫星影像，换成高德：
   url:"https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}", subdomains:"1234", maximumLevel:18 */

const CSS = {0:"#808080",1:"#00b400",2:"#dcdc00",3:"#ff7800",4:"#e60000"};
const COLORS = {};
for(const k in CSS) COLORS[k] = Cesium.Color.fromCssColorString(CSS[k]);
const LABELS = ["未检出","完好","轻微损毁","严重损毁","完全损毁"];

let FEATURES = [];                 // 解析后的全部建筑(轻量数组，不建 Entity)
let colorMode = "pred";
let pointSize = 7;
const points = viewer.scene.primitives.add(new Cesium.PointPrimitiveCollection());

function centroid(geom){           // 取多边形外环顶点均值
  let ring = geom.type === "MultiPolygon" ? geom.coordinates[0][0] : geom.coordinates[0];
  let sx=0, sy=0, n=0;
  for(let i=0;i<ring.length-1;i++){ sx+=ring[i][0]; sy+=ring[i][1]; n++; }
  return [sx/n, sy/n];
}

function buildDisasterList(){
  const counts = {};
  for(const f of FEATURES) counts[f.disaster] = (counts[f.disaster]||0)+1;
  const sel = document.getElementById("disaster");
  const all = document.createElement("option"); all.value="__all__"; all.textContent="全部灾害"; sel.appendChild(all);
  const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  for(const [d,c] of sorted){ const o=document.createElement("option"); o.value=d; o.textContent=`${d} (${c})`; sel.appendChild(o); }
  return sorted.length ? sorted[0][0] : "__all__";
}

function render(){
  const sel = document.getElementById("disaster").value;
  points.removeAll();
  const counts = {0:0,1:0,2:0,3:0,4:0};
  let minLng=999,minLat=999,maxLng=-999,maxLat=-999, shown=0;
  for(const f of FEATURES){
    if(sel!=="__all__" && f.disaster!==sel) continue;
    const cls = colorMode==="pred" ? f.pred_cls : f.true_cls;
    points.add({
      position: Cesium.Cartesian3.fromDegrees(f.lng, f.lat),
      color: COLORS[cls]||COLORS[0],
      pixelSize: pointSize,
      outlineColor: Cesium.Color.BLACK.withAlpha(0.35), outlineWidth: 1,
      id: f
    });
    counts[cls]++; shown++;
    if(f.lng<minLng)minLng=f.lng; if(f.lng>maxLng)maxLng=f.lng;
    if(f.lat<minLat)minLat=f.lat; if(f.lat>maxLat)maxLat=f.lat;
  }
  const dmg = counts[2]+counts[3]+counts[4];
  document.getElementById("stat").innerHTML =
    `共 ${shown} 栋｜受损 ${dmg} (${shown?(100*dmg/shown).toFixed(1):0}%)<br>`+
    `完好${counts[1]} 轻微${counts[2]} 严重${counts[3]} 完全${counts[4]} 未检出${counts[0]}`;
  document.getElementById("mode").textContent = "当前：" + (colorMode==="pred"?"模型预测":"真值标注");
  if(shown){
    const pad = 0.01;
    viewer.camera.flyTo({destination: Cesium.Rectangle.fromDegrees(minLng-pad,minLat-pad,maxLng+pad,maxLat+pad)});
  }
}

// 点击拾取建筑 → 弹窗
const popup = document.getElementById("popup");
const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
handler.setInputAction((e)=>{
  const picked = viewer.scene.pick(e.position);
  if(Cesium.defined(picked) && picked.id && picked.id.uid){
    const f = picked.id;
    popup.innerHTML = `<b>${f.uid}</b><br>灾害: ${f.disaster}<br>`+
      `预测: <b style="color:${CSS[f.pred_cls]}">${LABELS[f.pred_cls]}</b><br>`+
      `真值: ${LABELS[f.true_cls]}<br>面积: ${f.area_m2} m²`;
    popup.style.display="block";
    popup.style.left=(e.position.x+12)+"px"; popup.style.top=(e.position.y+12)+"px";
  } else { popup.style.display="none"; }
}, Cesium.ScreenSpaceEventType.LEFT_CLICK);

// 加载并解析 GeoJSON（自己解析成轻量数组，不用 GeoJsonDataSource，避免上万 Entity）
fetch("damage_buildings.geojson").then(r=>r.json()).then(fc=>{
  for(const ft of fc.features){
    const c = centroid(ft.geometry);
    const p = ft.properties;
    FEATURES.push({lng:c[0], lat:c[1], disaster:p.disaster, uid:p.uid,
      pred_cls:p.pred_cls, true_cls:p.true_cls, area_m2:p.area_m2});
  }
  const def = buildDisasterList();
  document.getElementById("disaster").value = def;
  render();
}).catch(err=>alert("GeoJSON 加载失败："+err+"\n请确认本页与 damage_buildings.geojson 同目录并经 http.server 访问。"));

document.getElementById("disaster").onchange = render;
document.getElementById("psize").oninput = (e)=>{ pointSize=+e.target.value; render(); };
document.getElementById("btnPred").onclick = ()=>{ colorMode="pred";
  btnPred.classList.remove("off"); btnTrue.classList.add("off"); render(); };
document.getElementById("btnTrue").onclick = ()=>{ colorMode="true";
  btnTrue.classList.remove("off"); btnPred.classList.add("off"); render(); };
</script>
</body>
</html>
